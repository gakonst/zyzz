name: Site
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_dispatch:

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Deployment builds must not restore shared CI caches.
    cache-mode: none
    if: >-
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    name: Deploy site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: $/.github/actions/install-dependencies
      - name: Build library
        run: pnpm build
      - name: Check site types
        run: pnpm --dir site check:types
      - name: Build site
        run: pnpm --dir site build
      - name: Prepare deployment
        id: config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          script: |
            if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) {
              throw new Error('Site deployment requires CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN')
            }

            const pull = context.payload.pull_request
            if (pull) {
              const { data: current } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pull.number,
              })
              if (current.state !== 'open' || current.head.sha !== pull.head.sha) {
                core.setOutput('current', 'false')
                return
              }

              const fs = require('node:fs')
              const path = 'site/dist/server/wrangler.json'
              const config = JSON.parse(fs.readFileSync(path, 'utf8'))
              config.name = `zyzz-site-pr-${pull.number}`
              config.workers_dev = true
              config.routes = []
              delete config.route
              fs.writeFileSync(path, JSON.stringify(config))
            }
            core.setOutput('current', 'true')
      - name: Deploy Worker
        id: deploy
        if: steps.config.outputs.current == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config dist/server/wrangler.json
          packageManager: pnpm
          workingDirectory: site
          wranglerVersion: '4.135.0'
      - name: Report deployment
        if: steps.deploy.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.URL
            if (!url || new URL(url).protocol !== 'https:') {
              throw new Error('Site deployment did not return an HTTPS URL')
            }
            await core.summary.addLink('Open site', url).write()

            const pull = context.payload.pull_request
            if (!pull) return
            const { data: current } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pull.number,
            })
            if (current.state !== 'open' || current.head.sha !== pull.head.sha) return

            const marker = '<!-- zyzz-site-preview -->'
            const body = `${marker}\n## Site preview\n\n[Open preview](${url})\n\nCommit: \`${pull.head.sha}\``
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pull.number,
            })
            const comment = comments.find((entry) =>
              entry.user?.login === 'github-actions[bot]' && entry.body?.includes(marker),
            )
            if (comment) {
              await github.rest.issues.updateComment({ ...context.repo, body, comment_id: comment.id })
            } else {
              await github.rest.issues.createComment({ ...context.repo, body, issue_number: pull.number })
            }

  cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Remove site preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          script: |
            const { CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token } = process.env
            if (!account || !token) return

            const name = `zyzz-site-pr-${context.payload.pull_request.number}`
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}`, {
              headers: { Authorization: `Bearer ${token}` },
              method: 'DELETE',
            })
            if (!response.ok && response.status !== 404) {
              throw new Error(`Site preview deletion failed: ${response.status}`)
            }

permissions:
  contents: read
