name: Prerelease
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
jobs:
  build:
    cache-mode: none
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: $/.github/actions/install-dependencies
      - name: Build package
        run: pnpm build
      - name: Prerelease
        # Uploads packed tarballs to pkg.pr.new, not the npm registry.
        run: pnpm exec pkg-pr-new publish --pnpm # zizmor: ignore[use-trusted-publishing]
    timeout-minutes: 35

permissions:
  contents: read
